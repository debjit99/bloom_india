[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "bloom-india"
version         = "0.1.0"
description     = "Local-first point-in-time financial data platform for Indian markets (NSE/BSE)"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10"

authors = [
    { name = "debjit99" }
]

keywords = [
    "NSE", "BSE", "India", "stock market", "fundamental data",
    "backtesting", "point-in-time", "XBRL", "Nifty 50",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "requests>=2.28",
    "pyyaml>=6.0",
    "plotly>=5.15",
    "streamlit>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]
bloom-india-setup    = "bloom_india.setup:main"
bloom-india-mf-api   = "bloom_india.mf_rest.server:app"
bloom-india-mf-dash  = "bloom_india.mf_terminal.app:main"

[project.urls]
Homepage   = "https://github.com/debjit99/bloom_india"
Repository = "https://github.com/debjit99/bloom_india"
Issues     = "https://github.com/debjit99/bloom_india/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bloom_india*"]

[tool.setuptools.package-data]
bloom_india = ["config.yaml.example"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
